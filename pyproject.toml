[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.6,<0.12"]

[dependency-groups]
dev = [
  "pdbpp>=0.12.1"
]
test = [
  "pytest>=8"
]

[project]
name = "pydantic-ast"
version = "0.2.0"
description = "Pydantic models covering Python AST types"
authors = [
  {name = "Louis Maddox", email = "louismmx@gmail.com"}
]
keywords = [
  'pydantic',
  'serialization',
  'deserialization',
  'parsing'
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Topic :: Software Development :: Libraries",
  'Framework :: Pydantic',
  'Framework :: Pydantic :: 2',
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11"
]
dependencies = [
  "pydantic>=2.1.1"
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
  "pre-commit>=4.1.0"
]

[project.scripts]
pydantic-ast = "pydantic_ast.cli:read_command_line"

[tool.isort]
known_first_party = ["pydantic_ast"]

[tool.pdm]
version = {source = "file", path = "src/pydantic_ast/__init__.py"}

[tool.ruff]
extend-ignore = ["F401", "F403"]

[tool.uv]
default-groups = "all"
